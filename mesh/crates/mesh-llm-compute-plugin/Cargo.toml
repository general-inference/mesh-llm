[package]
name = "mesh-llm-compute-plugin"
version.workspace = true
edition = "2024"
license.workspace = true
description = "mesh-llm plugin that runs isolated microVM sandboxes across a private mesh"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"
# Ships as a plugin archive, not on crates.io.
publish = false

[lints]
workspace = true

[[bin]]
name = "mesh-compute"
path = "src/main.rs"

[features]
default = ["image-download"]
# Fetch published guest images on first use. Off in the Linux build that runs
# inside WSL, which never downloads and must stay free of C dependencies.
image-download = ["dep:reqwest", "dep:sha2", "dep:hex", "dep:tar", "dep:flate2"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
flate2 = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.79.0" }
mesh-llm-plugin = { path = "../mesh-llm-plugin", version = "0.79.0" }
mesh-llm-compute-guest = { path = "../mesh-llm-compute-guest", version = "0.79.0", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13", optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true, optional = true }
tar = { version = "0.4", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = { version = "0.3", features = ["block2", "dispatch2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
