[package]
name = "mesh-llm-sandbox-guest"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Guest agent and vsock wire protocol for mesh-llm sandbox microVMs"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mesh-sandbox-guest"
path = "src/main.rs"

[features]
default = []
# Async frame helpers for the host side of the protocol.
tokio = ["dep:tokio"]

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
