name: Compute Plugin Release Artifacts

# Builds everything the `compute` plugin publishes with a mesh-llm release:
#
#   compute-image-base-<tag>-{x86_64,aarch64}.tar.gz   guest images
#   sandbox-<tag>-<target>.{tar.gz,zip}                plugin archives
#
# The images are built first; their sha256s are compiled into the plugin as
# MESH_COMPUTE_IMAGE_PINS, so an archive the catalog pins also pins the images
# it downloads. A smoke test then installs the Linux x86_64 archive on a KVM
# runner and boots a sandbox from the images, fetched and verified through the
# same download path users take, before anything is published.
#
# Uploaded artifacts named `release-compute-*` are picked up by the Release
# workflow's publish job; everything else stays internal to the run. Dispatch
# it on its own to rehearse a release without publishing.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the artifacts belong to, for example v0.80.0.
        required: true
        type: string
      source_sha:
        description: Immutable source revision to build.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to name the artifacts after (nothing is published).
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  IMAGE_NAME: base

jobs:
  images:
    name: Compute guest image ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      # Kernel builds dominate the image build; reuse one built from the same
      # version and configuration.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ runner.temp }}/compute-images/${{ env.IMAGE_NAME }}/${{ matrix.arch }}/kernel
            ${{ runner.temp }}/compute-images/${{ env.IMAGE_NAME }}/${{ matrix.arch }}/image.json
          key: compute-kernel-${{ matrix.arch }}-${{ hashFiles('mesh/crates/mesh-llm-compute-guest/image/kernel.config', 'mesh/crates/mesh-llm-compute-guest/image/build-kernel.sh', 'mesh/crates/mesh-llm-compute-guest/image/builder.Dockerfile') }}
      - name: Build the guest image
        run: mesh/crates/mesh-llm-compute-guest/image/build.sh "$RUNNER_TEMP/compute-images"
      - name: Archive it and record its pin
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pin"
          digest="$(mesh/crates/mesh-llm-compute-guest/image/archive.sh \
            "$RUNNER_TEMP/compute-images" "$IMAGE_NAME" "$RELEASE_TAG" "$RUNNER_TEMP/release")"
          printf '%s/%s=%s\n' "$IMAGE_NAME" "$ARCH" "$digest" > "$RUNNER_TEMP/pin/$ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-compute-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compute-image-pin-${{ matrix.arch }}
          path: ${{ runner.temp }}/pin/${{ matrix.arch }}
          if-no-files-found: error

  pins:
    name: Compute image pins
    needs: images
    runs-on: ubuntu-24.04
    outputs:
      pins: ${{ steps.pins.outputs.pins }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compute-image-pin-*
          path: pins
          merge-multiple: true
      - id: pins
        run: |
          set -euo pipefail
          pins="$(cat pins/* | paste -sd, -)"
          if ! [[ "$pins" =~ ^([a-z0-9_.-]+/[a-z0-9_]+=[0-9a-f]{64},?)+$ ]]; then
            echo "::error::unexpected image pins: $pins" >&2
            exit 1
          fi
          echo "pins=$pins" >> "$GITHUB_OUTPUT"

  plugin:
    name: Compute plugin ${{ matrix.target }}
    needs: pins
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # The Linux build the Windows plugin runs inside WSL: static, so it
          # runs whatever the distribution's libc, and without downloads.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            features: --no-default-features
    env:
      MESH_COMPUTE_IMAGE_PINS: ${{ needs.pins.outputs.pins }}
      MESH_COMPUTE_RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      # The repository's cargo config compiles through sccache.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: ./.github/actions/configure-sccache-gha
        with:
          allow_depot_remote_cache: "false"
          allow_native_github_cache: "false"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FEATURES is a flag list or empty
          cargo build --release --locked -p mesh-llm-compute-plugin --target "$TARGET" $FEATURES
          mkdir -p "$RUNNER_TEMP/bin"
          binary="target/$TARGET/release/mesh-compute"
          [[ "$TARGET" == *windows* ]] && binary="$binary.exe"
          cp "$binary" "$RUNNER_TEMP/bin/"
      - name: Sign with the virtualization entitlement
        if: runner.os == 'macOS'
        run: mesh/crates/mesh-llm-compute-plugin/packaging/sign-macos.sh "$RUNNER_TEMP/bin/mesh-compute"
      - name: Check the binary runs and write its package manifest
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: |
          set -euo pipefail
          binary="$(ls "$RUNNER_TEMP"/bin/mesh-compute*)"
          "$binary" --version
          "$binary" --print-package-manifest > "$RUNNER_TEMP/bin/plugin-manifest.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compute-bin-${{ matrix.target }}
          path: ${{ runner.temp }}/bin/*
          if-no-files-found: error

  package:
    name: Package compute plugin
    needs: plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compute-bin-*
          path: bins
      - name: Package every target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          package=mesh/crates/mesh-llm-compute-plugin/packaging/package.sh
          manifest=bins/compute-bin-x86_64-unknown-linux-gnu/plugin-manifest.json
          # Every build describes the same plugin; refuse to ship if not.
          for other in bins/*/plugin-manifest.json; do
            cmp -s "$manifest" "$other" || { echo "::error::$other differs from $manifest" >&2; exit 1; }
          done
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            "$package" --target "$target" --tag "$RELEASE_TAG" --manifest "$manifest" \
              --binary "bins/compute-bin-$target/mesh-compute" --out release
          done
          "$package" --target x86_64-pc-windows-msvc --tag "$RELEASE_TAG" --manifest "$manifest" \
            --binary bins/compute-bin-x86_64-pc-windows-msvc/mesh-compute.exe \
            --linux-binary bins/compute-bin-x86_64-unknown-linux-musl/mesh-compute --out release
          ls -l release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-compute-plugin
          path: release/*
          if-no-files-found: error

  smoke:
    name: Compute plugin smoke test (Linux x86_64, KVM)
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-compute-plugin
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-compute-image-x86_64
          path: mirror/${{ inputs.tag }}
      - name: Install the plugin and boot sandboxes from the published images
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tar -xzf "release/compute-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
          # Serve the image like the release will, so the check downloads it
          # and verifies the pin compiled into the plugin.
          docker run -d --rm --name mirror -p 127.0.0.1:8080:80 \
            -v "$PWD/mirror:/usr/share/nginx/html:ro" nginx:1.27-alpine
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          settings="{\"state_dir\":\"$RUNNER_TEMP/sandbox\",\"image_url\":\"http://127.0.0.1:8080\"}"
          MESH_COMPUTE_SETTINGS="$settings" compute/compute check
          MESH_COMPUTE_SETTINGS="$settings" compute/compute check --bridge
